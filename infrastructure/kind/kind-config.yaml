kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: raas-cluster
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Expose port 80 for HTTP ingress
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  # Expose port 443 for HTTPS ingress
  - containerPort: 443
    hostPort: 443
    protocol: TCP
