apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: raas
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
      - name: init-models
        image: curlimages/curl:latest
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Waiting for Ollama to be ready..."
            until curl -sf http://localhost:11434/api/tags > /dev/null; do
              echo "Waiting..."
              sleep 5
            done

            echo "Pulling default model: llama3.2"
            curl -X POST http://localhost:11434/api/pull \
              -H "Content-Type: application/json" \
              -d '{"name": "llama3.2"}' \
              --max-time 600

            echo "Model pulled successfully"
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: http
        volumeMounts:
        - name: ollama-data
          mountPath: /root/.ollama
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: ollama-data
        persistentVolumeClaim:
          claimName: ollama-data
