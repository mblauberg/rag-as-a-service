apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: raas-ingress
  namespace: raas
  labels:
    app: raas
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # API routes - match /api and /api/*
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      # Frontend routes - match everything else (must be last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
