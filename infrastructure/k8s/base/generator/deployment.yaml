apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
  namespace: raas
  labels:
    app: generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: generator
  template:
    metadata:
      labels:
        app: generator
    spec:
      containers:
      - name: generator
        image: raas-generator:latest
        imagePullPolicy: Never  # For local development
        ports:
        - containerPort: 8002
          name: http
        envFrom:
        - configMapRef:
            name: generator-config
        - secretRef:
            name: generator-api-keys
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health/
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
