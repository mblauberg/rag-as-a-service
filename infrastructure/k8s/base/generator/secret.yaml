apiVersion: v1
kind: Secret
metadata:
  name: generator-api-keys
  namespace: raas
type: Opaque
stringData:
  # External LLM Provider API Keys
  # To enable external providers:
  # 1. Set the API key values below
  # 2. Update ENABLE_* flags in generator-config ConfigMap to "true"
  # 3. Redeploy the generator service
  OPENAI_API_KEY: "***REMOVED_OPENAI_KEY***"
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
