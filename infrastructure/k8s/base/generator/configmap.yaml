apiVersion: v1
kind: ConfigMap
metadata:
  name: generator-config
  namespace: raas
data:
  # Ollama Configuration
  OLLAMA_URL: "http://ollama:11434"
  DEFAULT_MODEL: "openai:gpt-5-mini"
  ENABLE_OLLAMA: "false"

  # Generation Settings
  MAX_CHUNKS: "5"
  TEMPERATURE: "0.1"
  MAX_TOKENS: "2000"
  TIMEOUT: "30"

  # External Provider Flags (API keys in secret)
  ENABLE_OPENAI: "true"
  ENABLE_ANTHROPIC: "false"
  ENABLE_GOOGLE: "false"
