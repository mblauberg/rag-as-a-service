apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
  namespace: raas
  labels:
    app: embedder
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: embedder
  template:
    metadata:
      labels:
        app: embedder
    spec:
      containers:
      - name: embedder
        image: raas-embedder:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
          name: http
        envFrom:
        - configMapRef:
            name: embedder-config
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/torch
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 3000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: embedder-model-cache
