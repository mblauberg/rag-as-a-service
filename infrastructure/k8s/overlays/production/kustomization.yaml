apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: raas

resources:
- ../../base

patches:
- path: replica-patches.yaml
- path: imagepull-patches.yaml
- path: secret-patches.yaml

# Use production registry images
images:
- name: raas-api
  newName: gcr.io/your-project/raas-api
  newTag: v1.0.0
- name: raas-embedder
  newName: gcr.io/your-project/raas-embedder
  newTag: v1.0.0
- name: raas-frontend
  newName: gcr.io/your-project/raas-frontend
  newTag: v1.0.0
- name: raas-generator
  newName: gcr.io/your-project/raas-generator
  newTag: v1.0.0
