# Lower resource limits for local development
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: raas
spec:
  template:
    spec:
      containers:
      - name: postgres
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: raas
spec:
  template:
    spec:
      containers:
      - name: qdrant
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: raas
spec:
  template:
    spec:
      containers:
      - name: api
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
  namespace: raas
spec:
  template:
    spec:
      containers:
      - name: embedder
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
