apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: raas

resources:
- ../../base

patches:
- path: replica-patches.yaml
- path: resource-patches.yaml
- path: storage-patches.yaml
- path: hpa-patches.yaml

# Use local images
images:
- name: raas-api
  newTag: latest
- name: raas-embedder
  newTag: latest
- name: raas-frontend
  newTag: latest
- name: raas-generator
  newTag: latest
