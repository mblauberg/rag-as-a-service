[tool.poetry]
name = "raas-embedder"
version = "0.1.0"
description = "Embedding generation service for RAAS using sentence-transformers"
authors = ["RAAS Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.120.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
pydantic = "^2.12.0"
pydantic-settings = "^2.1.0"
sentence-transformers = "^2.2.2"
qdrant-client = "^1.15.0"
torch = "^2.6.0"
numpy = "^2.1.0"
tiktoken = "^0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
