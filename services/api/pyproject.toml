[tool.poetry]
name = "raas-api"
version = "0.1.0"
description = "FastAPI gateway service for RAAS"
authors = ["RAAS Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"

# Core framework (Python 3.13 compatible)
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.8.0"            # CRITICAL: >=2.8.0 for Python 3.13
pydantic-settings = "^2.6.0"

# Database
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
alembic = "^1.14.0"

# HTTP
httpx = "^0.27.0"
python-multipart = "^0.0.6"

# Vector DB
qdrant-client = "^1.12.0"

# File processing (updated versions)
pypdf = "^5.1.0"               # Updated from 3.x
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"
aiofiles = "^24.1.0"
python-magic = "^0.4.27"

# NLP/ML
sentence-transformers = "^3.3.0"  # Updated from 2.x
tiktoken = "^0.8.0"
langchain-text-splitters = "^0.3.0"
langchain-core = "^0.3.0"
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.13.0"
ruff = "^0.8.0"
aiosqlite = "^0.19.0"
greenlet = "^3.2.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false  # Too strict for now
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "sentence_transformers.*",
    "langchain.*",
    "unstructured.*"
]
ignore_missing_imports = true
