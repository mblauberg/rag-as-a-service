[tool.poetry]
name = "raas-api"
version = "0.1.0"
description = "FastAPI gateway service for RAAS"
authors = ["RAAS Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.6"
httpx = "^0.26.0"
qdrant-client = "^1.7.0"
python-magic = "^0.4.27"
pypdf = "^3.17.0"
python-docx = "^1.1.0"
aiofiles = "^23.2.1"
unstructured = "^0.11.0"
tiktoken = "^0.5.2"
langchain-text-splitters = "^0.2.0"
markdown = "^3.5.1"
openpyxl = "^3.1.2"
python-pptx = "^0.6.23"
beautifulsoup4 = "^4.12.2"
lxml = "^4.9.3"
sentence-transformers = "^2.2.2"
langchain-experimental = "^0.0.60"
langchain-core = "^0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
aiosqlite = "^0.19.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
