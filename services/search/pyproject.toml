[tool.poetry]
name = "raas-search"
version = "0.1.0"
description = "Search and retrieval service for RAAS"
authors = ["Michael Blauberg <mblauberg@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.119.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.12.0"
pydantic-settings = "^2.6.0"
httpx = "^0.27.0"
qdrant-client = "^1.12.0"
asyncpg = "^0.30.0"
sqlalchemy = "^2.0.36"
sentence-transformers = "^3.3.0"
numpy = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.13.0"
ruff = "^0.8.0"
greenlet = "^3.2.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "B904",  # Within except, raise from err (pre-existing, defer to pragmatic exception handling)
    "N818",  # Exception naming convention (pre-existing, project uses Exception not Error suffix)
    "F841",  # Local variable assigned but never used (pre-existing, mostly in tests)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "sentence_transformers.*"]
ignore_missing_imports = true
